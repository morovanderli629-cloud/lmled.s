<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lm Led’s – Película Automotiva e LED em Araucária</title>
<style>
:root{--bg:#0d1117;--card:#161c26;--line:#273142;--text:#f2f5f9;--muted:#9aa6b8;--accent:#ff5a1f;--wa:#25d366;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:32px 20px 40px;text-align:center}
.logo{width:132px;height:132px;border-radius:50%;display:block;margin:0 auto 16px;box-shadow:0 0 0 3px var(--text)}
h1{font-size:24px;margin:0 0 4px;font-weight:800}
.sub{margin:0 0 6px;color:var(--muted);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 24px}
.tags b{font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px}
a.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;margin:0 0 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:700;font-size:16px;padding:0 16px}
a.btn:hover{border-color:var(--accent)}
a.btn:focus-visible{outline:3px solid var(--text);outline-offset:2px}
a.main{background:var(--wa);border-color:var(--wa);color:#05210f;min-height:62px;font-size:17px}
a.hot{background:var(--accent);border-color:var(--accent);color:#fff}
a.btn,a.main,a.hot{background:transparent;border:2px solid var(--text);border-radius:999px;color:var(--text);text-transform:uppercase;letter-spacing:.5px;font-weight:500;transition:background .2s}
a.btn:hover{background:rgba(255,255,255,.08);border-color:var(--text)}
a.main{border-color:var(--text)}
a.hot{border-color:var(--text)}
.sec{text-align:left;margin:28px 0 10px;font-size:15px;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;font-size:14px}
.box strong{display:block;margin-bottom:4px;font-size:15px}
.box span{color:var(--muted)}
footer{margin-top:28px;font-size:13px;color:var(--muted)}
